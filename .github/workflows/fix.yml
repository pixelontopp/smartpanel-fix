name: Fix SmartPanel APKs

on:
  push:
    branches:
      - main

jobs:
  fix:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing zipalign apksigner

      - name: Download apktool jar
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo "java -jar $PWD/apktool.jar \"\$@\"" | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download APKs from release
        run: |
          gh release download "v1" \
            --pattern "*.apk" \
            --dir ./apks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files
        run: ls -la ./apks/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug,O=Debug,C=US" \
            -storepass debugpass \
            -keypass debugpass

      - name: Fix SmartPanel.apk
        run: |
          apktool d "apks/SmartPanel.apk" -o decoded_1
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_1/AndroidManifest.xml

          python3 << 'PYEOF'
          import os, re
          smali_files = []
          for root, dirs, files in os.walk("decoded_1"):
              for f in files:
                  if f.endswith(".smali"):
                      smali_files.append(os.path.join(root, f))
          patched = 0
          for path in smali_files:
              with open(path, "r", errors="ignore") as f:
                  content = f.read()
              new_content = re.sub(
                  r'(invoke-virtual \{[^}]+\}, Landroid/content/Context;->getSystemService)',
                  r':try_start_sys\n    \1',
                  new_content
              )
              if new_content != content:
                  with open(path, "w") as f:
                      f.write(new_content)
                  patched += 1
          print(f"Patched {patched} smali files")
          PYEOF

          apktool b decoded_1 -o sp1_unsigned.apk
          zipalign -v 4 sp1_unsigned.apk sp1_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out SmartPanel_fixed.apk \
            sp1_aligned.apk

      - name: Fix Smart.Panel.15.2.2.apk
        run: |
          apktool d "apks/Smart.Panel.15.2.2.apk" -o decoded_2
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_2/AndroidManifest.xml

          python3 << 'PYEOF'
          import os, re
          smali_files = []
          for root, dirs, files in os.walk("decoded_2"):
              for f in files:
                  if f.endswith(".smali"):
                      smali_files.append(os.path.join(root, f))
          patched = 0
          for path in smali_files:
              with open(path, "r", errors="ignore") as f:
                  content = f.read()
              new_content = re.sub(
                  r'(invoke-virtual \{[^}]+\}, Landroid/content/Context;->getSystemService)',
                  r':try_start_sys\n    \1',
                  new_content
              )
              if new_content != content:
                  with open(path, "w") as f:
                      f.write(new_content)
                  patched += 1
          print(f"Patched {patched} smali files")
          PYEOF

          apktool b decoded_2 -o sp2_unsigned.apk
          zipalign -v 4 sp2_unsigned.apk sp2_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out Smart.Panel.15.2.2.fixed.apk \
            sp2_aligned.apk

      - name: Fix GameSpace.Panther.Engine.2.0.apk
        run: |
          zipalign -v 4 "apks/GameSpace.Panther.Engine.2.0.apk" GameSpace_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out GameSpace.fixed.apk \
            GameSpace_aligned.apk

      - name: Upload all fixed APKs
        uses: actions/upload-artifact@v4
        with:
          name: All-Fixed-APKs
          path: |
            SmartPanel_fixed.apk
            Smart.Panel.15.2.2.fixed.apk
            GameSpace.fixed.apk

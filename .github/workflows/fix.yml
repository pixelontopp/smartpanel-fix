name: Fix SmartPanel APKs

on:
  push:
    branches:
      - main

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing zipalign apksigner

      - name: Download apktool jar
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo "java -jar $PWD/apktool.jar \"\$@\"" | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download APKs from release
        run: |
          gh release download "v1" \
            --pattern "*.apk" \
            --dir ./apks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files
        run: ls -la ./apks/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug,O=Debug,C=US" \
            -storepass debugpass \
            -keypass debugpass

      - name: Fix SmartPanel.apk
        run: |
          apktool d "apks/SmartPanel.apk" -o decoded_1 --no-src
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_1/AndroidManifest.xml
          apktool b decoded_1 -o sp1_unsigned.apk
          zipalign -v 4 sp1_unsigned.apk sp1_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out SmartPanel_fixed.apk \
            sp1_aligned.apk

      - name: Fix Smart.Panel.15.2.2.apk
        run: |
          apktool d "apks/Smart.Panel.15.2.2.apk" -o decoded_2 --no-src
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_2/AndroidManifest.xml
          apktool b decoded_2 -o sp2_unsigned.apk
          zipalign -v 4 sp2_unsigned.apk sp2_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out Smart.Panel.15.2.2.fixed.apk \
            sp2_aligned.apk

      - name: Fix GameSpace.Panther.Engine.2.0.apk
        run: |
          python3 << 'PYEOF'
          import zipfile, shutil, os
          src = "apks/GameSpace.Panther.Engine.2.0.apk"
          dst = "GameSpace_patched.apk"
          shutil.copy2(src, dst)
          with zipfile.ZipFile(dst, 'r') as z:
              manifest = bytearray(z.read("AndroidManifest.xml"))
          target_utf8 = b"android.uid.system"
          target_utf16 = "android.uid.system".encode("utf-16-le")
          replaced = False
          for target in [target_utf8, target_utf16]:
              idx = manifest.find(target)
              while idx != -1:
                  for i in range(len(target)):
                      manifest[idx + i] = 0x00
                  print(f"Patched at offset {idx}")
                  replaced = True
                  idx = manifest.find(target, idx + 1)
          if not replaced:
              print("sharedUserId not found")
          else:
              print("Patch applied")
          tmp = dst + ".tmp"
          with zipfile.ZipFile(dst, 'r') as zin:
              with zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename == "AndroidManifest.xml":
                          zout.writestr(item, bytes(manifest))
                      else:
                          zout.writestr(item, zin.read(item.filename))
          os.replace(tmp, dst)
          print("Done")
          PYEOF
          zipalign -v 4 GameSpace_patched.apk GameSpace_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out GameSpace.fixed.apk \
            GameSpace_aligned.apk

      - name: Upload all fixed APKs
        uses: actions/upload-artifact@v4
        with:
          name: All-Fixed-APKs
          path: |
            SmartPanel_fixed.apk
            Smart.Panel.15.2.2.fixed.apk
            GameSpace.fixed.apk

name: Fix SmartPanel APKs

on:
  push:
    branches:
      - main

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing zipalign apksigner zip

      - name: Download apktool jar
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          echo '#!/bin/bash' | sudo tee /usr/local/bin/apktool
          echo "java -jar $PWD/apktool.jar \"\$@\"" | sudo tee -a /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Download APKs from release
        run: |
          gh release download "v1" \
            --pattern "*.apk" \
            --dir ./apks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files
        run: ls -la ./apks/

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias debugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Debug,O=Debug,C=US" \
            -storepass debugpass \
            -keypass debugpass

      - name: Fix SmartPanel.apk
        run: |
          apktool d "apks/SmartPanel.apk" -o decoded_1 --no-src
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_1/AndroidManifest.xml
          apktool b decoded_1 -o sp1_unsigned.apk
          zipalign -v 4 sp1_unsigned.apk sp1_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out SmartPanel_fixed.apk \
            sp1_aligned.apk

      - name: Fix Smart.Panel.15.2.2.apk
        run: |
          apktool d "apks/Smart.Panel.15.2.2.apk" -o decoded_2 --no-src
          sed -i 's/android:sharedUserId="android.uid.system"//g' decoded_2/AndroidManifest.xml
          apktool b decoded_2 -o sp2_unsigned.apk
          zipalign -v 4 sp2_unsigned.apk sp2_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out Smart.Panel.15.2.2.fixed.apk \
            sp2_aligned.apk

      - name: Fix GameSpace.Panther.Engine.2.0.apk
        run: |
          cp "apks/GameSpace.Panther.Engine.2.0.apk" GameSpace_work.apk

          unzip -p GameSpace_work.apk AndroidManifest.xml > manifest_orig.bin

          python3 << 'PYEOF'
          with open("manifest_orig.bin", "rb") as f:
              data = bytearray(f.read())
          patched = 0
          for target in [b"android.uid.system", "android.uid.system".encode("utf-16-le")]:
              idx = data.find(target)
              while idx != -1:
                  data[idx:idx+len(target)] = b"\x00" * len(target)
                  patched += 1
                  idx = data.find(target, idx+1)
          with open("manifest_patched.bin", "wb") as f:
              f.write(data)
          print(f"Patched {patched} occurrences")
          PYEOF

          python3 << 'PYEOF2'
          import zipfile, os
          src = "GameSpace_work.apk"
          out = "GameSpace_patched.apk"
          with open("manifest_patched.bin", "rb") as f:
              patched_manifest = f.read()
          with zipfile.ZipFile(src, 'r') as zin:
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename == "AndroidManifest.xml":
                          zout.writestr(item, patched_manifest)
                      else:
                          zout.writestr(item, zin.read(item.filename))
          print("Repack done")
          PYEOF2

          zipalign -v 4 GameSpace_patched.apk GameSpace_aligned.apk
          apksigner sign \
            --ks debug.keystore \
            --ks-key-alias debugkey \
            --ks-pass pass:debugpass \
            --key-pass pass:debugpass \
            --out GameSpace.fixed.apk \
            GameSpace_aligned.apk

      - name: Upload all fixed APKs
        uses: actions/upload-artifact@v4
        with:
          name: All-Fixed-APKs
          path: |
            SmartPanel_fixed.apk
            Smart.Panel.15.2.2.fixed.apk
            GameSpace.fixed.apk
